<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>EarlyYears Nexus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: fixed sidebar + top bar + routed main view; hash routing between 15 screens */
:root{--navy:#183153;--teal:#43A6A0;--sky:#75BDE8;--coral:#F28C82;--yellow:#F4CF77;--bg:#F7F9FC;--card:#fff;--fg:#183153;--mute:#5b6b82;--line:#e3e9f2;--shadow:0 1px 3px rgba(24,49,83,.08),0 6px 18px rgba(24,49,83,.05);--side:#183153;--sidefg:#d6e2f2;--chip:#eaf5f4;--ok:#2d8a6e;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b2d;--card:#172640;--fg:#eaf0f8;--mute:#9fb0c7;--line:#26385a;--shadow:0 1px 3px rgba(0,0,0,.4);--side:#0a1424;--chip:#1c3a40;--teal:#58bdb6;--navy:#eaf0f8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1b2d;--card:#172640;--fg:#eaf0f8;--mute:#9fb0c7;--line:#26385a;--shadow:0 1px 3px rgba(0,0,0,.4);--side:#0a1424;--chip:#1c3a40;--teal:#58bdb6;--navy:#eaf0f8;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif;padding-inline:0}
h1,h2,h3{font-family:'Space Grotesk',Inter,sans-serif;text-wrap:balance;margin:0}
h1{font-size:26px}h2{font-size:18px}h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
#app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{background:var(--side);color:var(--sidefg);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:6px 10px 16px;color:#fff;font:700 16px 'Space Grotesk'}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--teal),var(--sky));display:grid;place-items:center;color:#fff;font-weight:700}
.nav{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;color:inherit;text-align:left;padding:8px 10px;border-radius:9px}
.nav:hover{background:rgba(255,255,255,.08)}
.nav[aria-current=page]{background:var(--teal);color:#fff}
.nav i{font-style:normal;width:18px;text-align:center}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
header .grow{flex:1;min-width:140px}
.search{width:100%;max-width:380px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.ib{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px}
main{padding:22px max(16px,env(safe-area-inset-right,0px)) 40px 22px;min-width:0}
.banner{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--mute);margin-bottom:16px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.kpi b{font:700 28px 'Space Grotesk';display:block}
.kpi small{color:var(--mute)}
.up{color:var(--ok);font-weight:600}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--chip);font-size:12px;font-weight:600}
.btn{background:var(--teal);color:#fff;border:0;border-radius:9px;padding:8px 14px;font-weight:600}
.btn.alt{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tab{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 13px}
.tab[aria-pressed=true]{background:var(--navy);color:var(--bg);border-color:var(--navy)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.scroll{overflow-x:auto}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--sky));transition:width .8s}
.modal{position:fixed;inset:0;background:rgba(10,20,36,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal>div{background:var(--card);border-radius:16px;padding:22px;max-width:520px;width:100%;max-height:85vh;overflow:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:30}
svg text{fill:var(--mute);font:11px Inter}
.view{animation:in .35s ease}
@keyframes in{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#menu{display:none}
@media (max-width:820px){#app{grid-template-columns:minmax(0,1fr)}aside{position:fixed;z-index:15;width:250px;transform:translateX(-100%);transition:transform .25s}aside.open{transform:none}#menu{display:inline-block}}

.hero-b{position:relative;overflow:hidden;background:linear-gradient(120deg,#183153,#2a6f86 60%,#43A6A0);color:#fff;border-radius:18px;padding:26px 28px;margin-bottom:16px;display:flex;justify-content:space-between;gap:16px;animation:in .5s both}
.hero-b h1{color:#fff;margin:6px 0 4px;font-size:30px}.hero-b p{opacity:.9;margin:0}.hero-b small{opacity:.8}
.bw{background:#fff;color:#183153}.bw.o{background:transparent;color:#fff;border:1px solid #ffffff80}
.orbs i{position:absolute;border-radius:50%;background:#ffffff1c;animation:drift 12s ease-in-out infinite}
.orbs i:nth-child(1){width:180px;height:180px;right:-40px;top:-60px}.orbs i:nth-child(2){width:110px;height:110px;right:140px;bottom:-50px;animation-delay:-4s}.orbs i:nth-child(3){width:60px;height:60px;right:60px;top:70px;animation-delay:-8s;background:#F4CF7755}
@keyframes drift{50%{transform:translate(-18px,14px) scale(1.1)}}
.kc{animation:in .5s both;transition:transform .2s,box-shadow .2s}.kc:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(24,49,83,.15)}
.kic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:17px}
.kpi .pill.up{background:#2d8a6e1f;color:var(--ok)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px}.seg button{border:0;background:none;border-radius:8px;padding:4px 12px}.seg button[aria-pressed=true]{background:var(--navy);color:var(--bg)}
.tip{position:absolute;transform:translate(-50%,-135%);background:var(--navy);color:var(--bg);padding:4px 10px;border-radius:8px;font-size:12px;font-weight:600;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap}
.aline{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s .1s forwards}.afill{animation:in 1s .6s both}
@keyframes draw{to{stroke-dashoffset:0}}
.dseg{animation:in .8s both}
.eco{border:1px solid var(--line);border-radius:12px;padding:12px}
.tl{margin-top:10px;position:relative}.ti{display:flex;gap:12px;padding:8px 0;position:relative}.ti i{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}.ti small{color:var(--mute)}
.ti:not(:last-child)::before{content:"";position:absolute;left:4px;top:20px;bottom:-6px;width:2px;background:var(--line)}
.evr{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.evr small{color:var(--mute)}
.dtb{width:46px;height:50px;border-radius:12px;background:var(--chip);display:grid;place-items:center;text-align:center;line-height:1;flex:none;padding-block:6px}.dtb b{font:700 18px 'Space Grotesk'}.dtb small{text-transform:uppercase;font-size:10px;color:var(--teal);font-weight:700}
.ins{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}.chip2{padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700;flex:none;margin-top:2px}
@media (prefers-reduced-motion:reduce){.aline{stroke-dashoffset:0}}
</style>
<div id="app">
<aside id="side" aria-label="Main navigation"><div class="brand"><span class="logo">E</span>EarlyYears Nexus</div><nav id="nav"></nav></aside>
<div style="min-width:0">
<header><button class="ib" id="menu" aria-label="Open menu">☰</button><div class="grow"><input class="search" id="gs" placeholder="Search resources, research, hubs…" aria-label="Global search"></div>
<select class="ib" id="role" aria-label="Demo role"><option>Executive Director</option><option>Parent / Caregiver</option><option>Early Childhood Professional</option><option>Community Hub Coordinator</option><option>Researcher</option><option>Policymaker / Partner</option></select>
<button class="ib" id="theme" aria-label="Toggle theme">◐</button><button class="ib" id="bell" aria-label="Notifications">🔔 3</button></header>
<main id="main"></main></div></div>
<div id="layer"></div>
<script>
const $=s=>document.querySelector(s);
const NAV=[["overview","◧","Executive Overview"],["parents","♡","Parent & Caregiver Hub"],["academy","✎","Digital Literacy Academy"],["pros","⚑","Early Years Professional Hub"],["research","❏","Research & Evidence Library"],["media","▶","Children's Media Intelligence"],["hubs","◎","Community Early Years Hubs"],["partners","⇄","Partner & Organization Network"],["programs","☰","Programs & Initiatives"],["policy","⚖","Policy & Advocacy"],["events","▦","Events & Workshops"],["impact","△","Impact & Evaluation"],["ai","✦","AI Research Assistant"],["reports","▤","Reports & Analytics"],["settings","⚙","Settings"]];
const S={saved:new Set(),enrolled:new Set(),reg:new Set(),orgs:[],layers:{school:1,early:1,child:1,health:1,family:1,comm:1},sel:null,flt:{}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function modal(html){$("#layer").innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div role="dialog" aria-modal="true">${html}<div class="row" style="margin-top:14px"><button class="btn alt" onclick="closeM()">Close</button></div></div></div>`}
function closeM(){$("#layer").innerHTML=""}
const DEMO=`<div class="banner">Prototype with synthetic data. All organizations, people, documents and figures are fictional demonstration records. Not a CMRRL product and not real service availability.</div>`;
function spark(v,c="#43A6A0"){const m=Math.max(...v),n=Math.min(...v),p=v.map((y,i)=>`${i*(100/(v.length-1))},${28-((y-n)/(m-n||1))*24}`).join(" ");return `<svg viewBox="0 0 100 30" width="100%" height="30" preserveAspectRatio="none"><polyline points="${p}" fill="none" stroke="${c}" stroke-width="2"/></svg>`}
function line(vals,labels,color="#43A6A0"){const W=420,H=170,m=Math.max(...vals)*1.1,p=vals.map((y,i)=>[30+i*(W-45)/(vals.length-1),H-24-(y/m)*(H-40)]);return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${[0,1,2,3].map(i=>`<line x1="30" x2="${W-10}" y1="${H-24-i*(H-40)/3}" y2="${H-24-i*(H-40)/3}" stroke="var(--line)"/><text x="2" y="${H-20-i*(H-40)/3}">${Math.round(m*i/3)}</text>`).join("")}<polyline fill="none" stroke="${color}" stroke-width="3" points="${p.map(q=>q.join(",")).join(" ")}"/>${p.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="${color}"/><text x="${q[0]-8}" y="${H-6}">${labels[i]}</text>`).join("")}</svg>`}
function bars(items,color="#75BDE8"){const m=Math.max(...items.map(i=>i[1]));return items.map(i=>`<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span>${i[0]}</span><b>${i[1]}</b></div><div class="bar"><span style="width:${i[1]/m*100}%;background:${color}"></span></div></div>`).join("")}
function count(){document.querySelectorAll("[data-n]").forEach(e=>{const n=+e.dataset.n,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900);e.textContent=Math.round(n*k);if(k<1)requestAnimationFrame(f)})(t0)})}
const MONTHS=["Jun","Jul","Aug","Sep","Oct","Nov"];
function area(vals,labels,color,id){const W=440,H=200,pl=34,pb=24,pt=14,m=Math.ceil(Math.max(...vals)*1.15/50)*50,x=i=>pl+i*(W-pl-14)/(vals.length-1),y=v=>H-pb-(v/m)*(H-pb-pt),pts=vals.map((v,i)=>[x(i),y(v)]),ln=pts.map(p=>p.join(",")).join(" "),ar=`${pl},${H-pb} ${ln} ${x(vals.length-1)},${H-pb}`;
return `<div class="cw" style="position:relative"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Trend chart"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${[0,1,2,3].map(i=>{const yy=H-pb-i*(H-pb-pt)/3;return `<line x1="${pl}" x2="${W-8}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pl-6}" y="${yy+4}" text-anchor="end">${Math.round(m*i/3)}</text>`}).join("")}<polygon points="${ar}" fill="url(#g${id})" class="afill"/><polyline points="${ln}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="aline" pathLength="1"/>${pts.map((p,i)=>`<text x="${p[0]}" y="${H-6}" text-anchor="middle">${labels[i]}</text><circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?color:'var(--card)'}" stroke="${color}" stroke-width="2"/><rect x="${p[0]-18}" y="0" width="36" height="${H-pb}" fill="transparent" onmouseenter="tip(this,${p[0]/W*100},${p[1]/H*100},'${labels[i]}: ${vals[i]}')" onmouseleave="tip()" ontouchstart="tip(this,${p[0]/W*100},${p[1]/H*100},'${labels[i]}: ${vals[i]}')"/>`).join("")}</svg><div class="tip" id="tip"></div></div>`}
function tip(el,x,y,t){const d=document.getElementById("tip");if(!d)return;if(!el){d.style.opacity=0;return}d.textContent=t;d.style.left=x+"%";d.style.top=y+"%";d.style.opacity=1}
function donut(items){const cols=["#43A6A0","#75BDE8","#F4CF77","#F28C82","#8a7fd1","#183153"],tot=items.reduce((a,b)=>a+b[1],0);let off=0;const r=52,c=2*Math.PI*r;
const segs=items.map((it,i)=>{const len=it[1]/tot*c,s=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${cols[i]}" stroke-width="18" stroke-dasharray="${len-2} ${c-len+2}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)" class="dseg" style="animation-delay:${i*.1}s"/>`;off+=len;return s}).join("");
return `<div class="row" style="gap:18px;flex-wrap:wrap"><svg viewBox="0 0 140 140" width="150" height="150" role="img" aria-label="Partner distribution">${segs}<text x="70" y="68" text-anchor="middle" style="font:700 20px 'Space Grotesk';fill:var(--fg)">${tot}</text><text x="70" y="84" text-anchor="middle">partners</text></svg><div style="flex:1;min-width:150px">${items.map((it,i)=>`<div class="row" style="justify-content:space-between;margin:5px 0;gap:8px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${cols[i]};margin-right:8px"></i>${it[0]}</span><b>${it[1]}</b></div>`).join("")}</div></div>`}
const ICO={hubs:"◎",partners:"⇄",res:"❏",prog:"☰",ev:"▦",pub:"✎"};
const KP=[["Active Community Hubs",24,"+8%",[14,16,17,20,22,24],"#43A6A0","hubs"],["Partner Organizations",68,"+12%",[40,48,52,58,63,68],"#75BDE8","partners"],["Educational Resources",145,"+6%",[100,112,120,128,137,145],"#F4CF77","res"],["Active Learning Programs",18,"+4%",[12,13,15,16,17,18],"#F28C82","prog"],["Community Events",12,"+9%",[6,8,7,10,11,12],"#8a7fd1","ev"],["Research Publications",86,"+5%",[60,66,71,77,82,86],"#183153","pub"]];
const SER={"Parent learning":[[120,168,210,260,310,372],"#43A6A0"],"Professional training":[[34,41,52,58,66,74],"#F28C82"],"Research engagement":[[80,95,120,150,170,205],"#75BDE8"]};
function miniArea(v,c,i){const m=Math.max(...v),n=Math.min(...v),p=v.map((y,k)=>[k*100/(v.length-1),30-((y-n)/(m-n||1))*24]),l=p.map(q=>q.join(",")).join(" ");return `<svg viewBox="0 0 100 34" width="100%" height="38" preserveAspectRatio="none"><defs><linearGradient id="k${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs><polygon points="0,34 ${l} 100,34" fill="url(#k${i})"/><polyline points="${l}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
function overview(){const per=S.per||6,sk=S.ser||"Parent learning",sd=SER[sk],vals=sd[0].slice(-per),labs=MONTHS.slice(-per);
const stake=[["Parents & Caregivers",372,82,"#43A6A0"],["Early Childhood Professionals",74,66,"#F28C82"],["Educational Institutions",26,58,"#183153"],["Health & Family Services",22,47,"#75BDE8"],["Research Organizations",10,71,"#F4CF77"],["Policymakers",6,36,"#8a7fd1"]];
const ev=[["Dec","3","Parent Digital Literacy Workshop","10:00 · Northvale Library (demo)"],["Dec","9","Educator Training Session","14:00 · Online"],["Dec","12","Research Roundtable","11:30 · Harbor Hall (demo)"],["Dec","17","Community Discussion","16:00 · Riverside Center (demo)"]];
return `<section class="hero-b"><div><small>Reporting period: Jun to Nov 2026 · Demo workspace</small><h1>Good morning, Will</h1><p>Your early years ecosystem at a glance.</p><div class="row" style="margin-top:14px"><button class="btn bw" onclick="location.hash='reports'">View reports</button><button class="btn bw o" onclick="location.hash='events'">Manage events</button></div></div><div class="orbs" aria-hidden="true"><i></i><i></i><i></i></div></section>${DEMO}
<div class="grid g3">${KP.map((k,i)=>`<div class="card kpi kc" style="animation-delay:${i*.06}s"><div class="row" style="justify-content:space-between"><span class="kic" style="background:${k[4]}26;color:${k[4]==='#183153'?'var(--fg)':k[4]}">${ICO[k[5]]}</span><span class="pill up">▲ ${k[2]}</span></div><small style="display:block;margin-top:10px">${k[0]}</small><b data-n="${k[1]}">0</b>${miniArea(k[3],k[4],i)}</div>`).join("")}</div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:14px"><div class="card"><div class="row" style="justify-content:space-between"><h2>Engagement trends</h2><div class="seg">${[3,6].map(n=>`<button aria-pressed="${per===n}" onclick="S.per=${n};go(true)">${n}M</button>`).join("")}</div></div><div class="tabs" style="margin:8px 0">${Object.keys(SER).map(k=>`<button class="tab" aria-pressed="${sk===k}" onclick="S.ser='${k}';go(true)">${k}</button>`).join("")}</div>${area(vals,labs,sd[1],"a")}<small>Synthetic data. Hover a point for its value.</small></div>
<div class="card"><h2>Partner distribution</h2><div style="margin-top:12px">${donut([["Schools",14],["Early learning",12],["Childcare",10],["Health agencies",9],["Family services",13],["Research & nonprofit",10]])}</div></div></div>
<div class="card" style="margin-top:14px"><h2>Ecosystem overview</h2><div class="grid g3" style="margin-top:12px">${stake.map(s=>`<div class="eco"><div class="row" style="justify-content:space-between"><b>${s[0]}</b><span style="color:${s[3]==='#183153'?'var(--fg)':s[3]};font-weight:700">${s[1]}</span></div><div class="bar" style="margin-top:8px"><span style="width:${s[2]}%;background:${s[3]}"></span></div><small>${s[2]}% engaged (demo)</small></div>`).join("")}</div></div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:14px"><div class="card"><h2>Recent activity</h2><div class="tl">${[["#43A6A0","Digital literacy resource published","2h ago"],["#75BDE8","Parent workshop scheduled","5h ago"],["#F28C82","Partnership added: Harbor Family Services (demo)","Yesterday"],["#F4CF77","Research item uploaded","Yesterday"],["#8a7fd1","Training cohort completed","2 days ago"]].map(a=>`<div class="ti"><i style="background:${a[0]}"></i><div>${a[1]}<small style="display:block">${a[2]}</small></div></div>`).join("")}</div></div>
<div class="card"><h2>Upcoming events</h2>${ev.map(e=>`<div class="evr"><div class="dtb"><small>${e[0]}</small><b>${e[1]}</b></div><div style="flex:1;min-width:0"><b>${e[2]}</b><small style="display:block">${e[3]}</small></div><button class="btn alt" onclick="location.hash='events'">View</button></div>`).join("")}</div>
